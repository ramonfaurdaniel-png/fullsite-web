<title>Fullsite Launch</title>
<style>
@font-face{font-family:'InterV';src:url(assets/inter.woff2) format('woff2');font-weight:100 900}
:root{--g:#10b981;--g2:#059669;--g3:#34d399;--ink:#0a0a0a;--red:#ef4444;--amb:#f59e0b;--line:#ececea}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden;height:100%}
#wrap{position:fixed;inset:0;display:grid;place-items:center}
#stage{width:1920px;height:1080px;position:relative;overflow:hidden;background:#fbfbf9;
  font-family:'InterV','Inter',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;flex:none}
.disp{font-family:'Inter Display','InterV',sans-serif}
.sc{position:absolute;inset:0;display:none;overflow:hidden}
.fill{position:absolute;inset:0}
.vp{position:absolute;inset:0;perspective:1400px;overflow:hidden}
.world{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.o{position:absolute;left:0;top:0;will-change:transform,filter}
.flat{position:absolute;left:50%;top:50%}
.hl{position:absolute;left:0;right:0;text-align:center;font-family:'Inter Display','InterV',sans-serif;font-weight:600;letter-spacing:-.045em;line-height:1.04}
.hl .w{display:inline-block;will-change:transform,filter,opacity}
.grad{background:linear-gradient(100deg,#059669,#10b981 40%,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.04em}
.gradr{background:linear-gradient(100deg,#dc2626,#ef4444 50%,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent}
.gradw{background:linear-gradient(100deg,#6ee7b7,#34d399 50%,#a7f3d0);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:#fff;border-radius:22px;border:1px solid rgba(0,0,0,.06);box-shadow:0 1px 2px rgba(0,0,0,.04),0 24px 60px -12px rgba(16,24,20,.18),0 60px 120px -40px rgba(16,24,20,.18);overflow:hidden}
.card.glow{box-shadow:0 0 0 2px rgba(16,185,129,.55),0 0 0 8px rgba(16,185,129,.12),0 30px 80px -10px rgba(16,185,129,.35)}
.dk{background:rgba(18,24,22,.72);border:1px solid rgba(255,255,255,.12);border-radius:24px;color:#fff;box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}
.lbl{font-size:13px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;color:#8a8a86}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:6px 12px;border-radius:99px;background:#ecfdf5;color:var(--g2)}
.chip.red{background:#fef2f2;color:#dc2626}.chip.amb{background:#fffbeb;color:#b45309}
.tab{font-variant-numeric:tabular-nums}
.wm{position:absolute;background:var(--ink);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.sq{position:absolute;background:var(--g);border-radius:2px}
.rc{width:300px;padding:22px 24px 26px;background:#fff;border-radius:16px;box-shadow:0 20px 50px -10px rgba(16,24,20,.2);border:1px solid rgba(0,0,0,.05)}
.rc .h{font-weight:700;font-size:17px;margin-bottom:12px;display:flex;justify-content:space-between}
.rc .r{display:flex;justify-content:space-between;font-size:15px;color:#555;padding:5px 0;border-bottom:1px dashed #e5e5e5}
.rc .t{display:flex;justify-content:space-between;font-weight:800;font-size:20px;margin-top:12px}
#hero{width:560px;padding:34px 38px 36px;border-radius:28px}
#hero .row{display:flex;justify-content:space-between;align-items:center;font-size:23px;padding:13px 0;border-bottom:1px solid var(--line);font-weight:500}
#hero .row b{font-weight:750;letter-spacing:-.02em}
#hero .loss{color:#dc2626;overflow:hidden}
#hero .loss span:first-child{display:flex;align-items:center;gap:12px;color:#444}
#hero .loss span:first-child:before{content:'';width:10px;height:10px;border-radius:50%;background:var(--red)}
#hero .tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:20px;padding:20px 22px;border-radius:18px;background:#fef2f2}
.orb{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.45),rgba(255,255,255,.06) 45%,rgba(16,185,129,.12) 70%,rgba(0,0,0,.25));
  border:1.5px solid rgba(255,255,255,.35);box-shadow:0 0 40px rgba(16,185,129,.35),inset 0 0 20px rgba(255,255,255,.12)}
.orb .in{width:62px;height:62px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden}
.orb .in img{width:100%;height:100%;object-fit:contain}
.orb svg{width:46px;height:46px}
.ring{border-radius:50%;border:2px solid rgba(52,211,153,.55);box-shadow:0 0 30px rgba(16,185,129,.35),inset 0 0 30px rgba(16,185,129,.2)}
#sphere{width:380px;height:380px;border-radius:50%;display:grid;place-items:center;text-align:center;
  background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.28),rgba(255,255,255,.04) 40%,rgba(16,185,129,.18) 72%,rgba(5,30,22,.6));
  border:2px solid rgba(110,231,183,.5);box-shadow:0 0 120px rgba(16,185,129,.45),inset 0 0 60px rgba(110,231,183,.25)}
#bar{width:980px;height:104px;border-radius:52px;display:flex;align-items:center;gap:20px;padding:0 18px 0 22px;font-size:32px;font-weight:500}
#bar .av{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#334155,#0f172a);display:grid;place-items:center;font-size:24px;font-weight:700;color:#cbd5e1;flex:none}
#bar .send{margin-left:auto;width:68px;height:68px;border-radius:50%;background:var(--g);display:grid;place-items:center;flex:none}
.caret{display:inline-block;width:3px;height:36px;background:var(--g3);vertical-align:middle;margin-left:4px}
.resp{width:470px;padding:30px 32px}
.resp .tg{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;letter-spacing:.12em;color:rgba(255,255,255,.6)}
.resp .tg i{width:12px;height:12px;border-radius:50%;display:block}
.resp .tt{font-family:'Inter Display','InterV';font-size:44px;font-weight:650;letter-spacing:-.035em;margin:16px 0 10px}
.resp .bd{font-size:21px;line-height:1.45;color:rgba(255,255,255,.7)}
#notif{width:760px;padding:22px 26px;border-radius:30px;display:flex;gap:18px;align-items:flex-start;background:rgba(245,245,245,.92);color:#111;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.appic{width:64px;height:64px;border-radius:16px;background:#0a0a0a;position:relative;flex:none}
.appic .wm{background:#fff;left:17px;top:11px;width:22px;height:31px}
.appic .sq{left:38px;top:36px;width:10px;height:10px}
.tablet{width:1280px;height:820px;border-radius:52px;background:#141414;padding:22px;box-shadow:0 60px 120px -20px rgba(16,24,20,.45),inset 0 0 0 2px #2a2a2a}
.scr{width:100%;height:100%;border-radius:32px;background:#f7f7f5;overflow:hidden;position:relative;display:grid;grid-template-columns:1fr 380px;grid-template-rows:76px 1fr}
.tb{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 26px;background:#fff;border-bottom:1px solid var(--line)}
.tb .fm{width:22px;height:30px;position:relative}
.tb .fm .wm{inset:0}.tb .fm .sq{left:67.9%;top:76.7%;width:32.1%;height:23.3%}
.tb .ttl{font-weight:700;font-size:20px}
.st{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;padding:9px 16px;border-radius:99px;background:#ecfdf5;color:var(--g2)}
.st i{width:10px;height:10px;border-radius:50%;background:var(--g);display:block}
.menu{padding:22px 24px}
.cats{display:flex;gap:10px;margin-bottom:20px}
.cats span{font-size:17px;font-weight:650;padding:10px 20px;border-radius:12px;background:#fff;border:1px solid var(--line);color:#555}
.cats span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.it{height:166px;border-radius:18px;background:#fff;border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}
.it:before{content:'';position:absolute;left:0;right:0;top:0;height:74px;background:var(--c,#d1fae5)}
.it b{font-size:19px;font-weight:700;letter-spacing:-.01em;position:relative}
.it span{font-size:16px;color:#777;font-weight:600;position:relative}
.it.hit{outline:3px solid var(--g);outline-offset:-3px}
.tk{background:#fff;border-left:1px solid var(--line);padding:22px 24px;display:flex;flex-direction:column}
.tk h4{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#888;margin-bottom:14px}
.tk .ln{display:flex;justify-content:space-between;font-size:18px;font-weight:600;padding:12px 0;border-bottom:1px solid var(--line)}
.tk .sum{margin-top:auto;display:flex;justify-content:space-between;font-size:22px;font-weight:800;padding:14px 0}
.pay{height:76px;border-radius:18px;background:var(--g);color:#fff;font-size:24px;font-weight:750;display:grid;place-items:center}
.paid{position:absolute;inset:0;background:rgba(247,247,245,.7);display:grid;place-items:center}
.paid .bx{background:#fff;border-radius:28px;padding:40px 70px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.18)}
.paid .ck{width:96px;height:96px;border-radius:50%;background:var(--g);display:grid;place-items:center;margin:0 auto 18px}
#cursor{position:absolute;left:0;top:0;width:44px;height:44px;pointer-events:none;z-index:5}
#ripple{position:absolute;width:20px;height:20px;border-radius:50%;border:3px solid var(--g);pointer-events:none;z-index:4}
.mc{padding:24px 26px}
.mc .num{font-family:'Inter Display','InterV';font-size:48px;font-weight:700;letter-spacing:-.04em}
.bar{height:10px;background:#f0f0ee;border-radius:9px;overflow:hidden;margin:7px 0 14px}
.bar i{display:block;height:100%;background:var(--g);border-radius:9px}
.dash{width:1180px;height:720px;display:grid;grid-template-columns:90px 1fr}
.side{background:#fafaf8;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:28px}
.side i{width:40px;height:40px;border-radius:12px;background:#ececea;display:block}
.side i.on{background:var(--g)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}
.kpi{border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.kpi .v{font-family:'Inter Display','InterV';font-size:40px;font-weight:700;letter-spacing:-.035em;margin-top:6px}
.kpi .d{font-size:15px;font-weight:700;color:var(--g2)}
#grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.05;z-index:50;background-size:480px 270px}
#wipe{position:absolute;left:50%;top:50%;border-radius:50%;z-index:45;pointer-events:none;transform:translate(-50%,-50%)}
#ui{position:fixed;left:0;right:0;bottom:0;padding:14px 20px;display:flex;gap:14px;align-items:center;background:linear-gradient(transparent,rgba(0,0,0,.8));font:600 13px system-ui;color:#fff;z-index:99;opacity:0;transition:opacity .3s}
body:hover #ui{opacity:1}
#ui button,#ui a{background:#10b981;border:0;color:#fff;font:700 13px system-ui;padding:8px 16px;border-radius:8px;cursor:pointer;text-decoration:none}
#ui input{flex:1;accent-color:#10b981}
#start{position:fixed;inset:0;display:grid;place-items:center;z-index:100;background:rgba(0,0,0,.45);cursor:pointer;color:#fff;font:700 18px system-ui;letter-spacing:.1em}
#start span{border:1.5px solid rgba(255,255,255,.6);padding:18px 34px;border-radius:99px;background:rgba(0,0,0,.3)}
body.render #ui,body.render #start{display:none}
</style>

  function play() { if (base >= DUR - .05) base = 0; aud.currentTime = base; aud.play().catch(() => { }); t0 = performance.now(); playing = true; btn.textContent = 'Pausa'; }
  function pause() { base = now(); playing = false; aud.pause(); btn.textContent = 'Play'; }
  btn.onclick = () => playing ? pause() : play();
  sc.oninput = () => { base = +sc.value; if (playing) { aud.currentTime = base; t0 = performance.now(); } };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); } });
  $('start').onclick = () => { $('start').remove(); play(); };
  window.ready.then(() => requestAnimationFrame(loop));
}
</script>
</body>
