<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fullsite Launch</title>
<style>
@font-face{font-family:'InterV';src:url(assets/inter.woff2) format('woff2');font-weight:100 900}
:root{--g:#10b981;--g2:#059669;--ink:#0a0a0a;--red:#ef4444;--paper:#f6f5f1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden;height:100%}
#wrap{position:fixed;inset:0;display:grid;place-items:center}
#stage{width:1920px;height:1080px;position:relative;overflow:hidden;background:#000;
  font-family:'Inter Display','InterV','Inter',system-ui,sans-serif;color:#fff;
  font-feature-settings:'ss01','cv11';-webkit-font-smoothing:antialiased;flex:none}
.sc{position:absolute;inset:0;display:none;overflow:hidden}
.fill{position:absolute;inset:0}
.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
.mask{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .06em .14em;margin:0 -.06em -.14em}
.mask>span{display:inline-block;will-change:transform;transform-origin:0 100%}
.dot{display:inline-block;width:.19em;height:.19em;background:var(--g);margin-left:.05em;border-radius:.012em}
.label{font-family:'InterV',sans-serif;font-weight:600;letter-spacing:.32em;text-transform:uppercase;font-size:20px;color:rgba(255,255,255,.55)}
.big{font-weight:700;letter-spacing:-.055em;line-height:.95}
.tab{font-variant-numeric:tabular-nums}
.wm{position:absolute;background:#fff;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.wmbox{position:absolute}
.wmbox .sq{position:absolute;background:var(--g);border-radius:2px;left:95.46%;top:77.83%;width:4.54%;height:20.43%}
.wmbox .wm{inset:0}
.pill{display:inline-block;background:#fff;color:var(--ink);border-radius:18px;padding:.08em .34em .14em;font-weight:650;letter-spacing:-.045em;box-shadow:0 18px 50px rgba(0,0,0,.35);white-space:nowrap}
.pill.g{background:var(--g);color:#fff}
.pill.k{background:var(--ink);color:#fff}
/* cards */
.card{position:relative;flex:none;height:250px;border-radius:22px;overflow:hidden;background:#fff;color:var(--ink);
  font-family:'InterV',sans-serif;box-shadow:0 30px 70px rgba(0,0,0,.55);padding:22px 24px}
.card:after{content:'';position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,255,255,.22),transparent 35%);pointer-events:none}
.card.dark{background:#141414;color:#fff;border:1px solid #262626}
.card.dark:after{background:linear-gradient(125deg,rgba(255,255,255,.08),transparent 35%)}
.card.green{background:var(--g);color:#fff}
.card.photo{padding:0;background:#222}
.card.photo img{width:100%;height:100%;object-fit:cover;display:block}
.card h6{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.5;margin-bottom:12px}
.card .row{display:flex;justify-content:space-between;font-size:17px;font-weight:500;padding:5px 0;border-bottom:1px solid rgba(0,0,0,.07)}
.card.dark .row{border-color:rgba(255,255,255,.08)}
.card .num{font-size:44px;font-weight:700;letter-spacing:-.04em}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 10px;border-radius:99px;background:#ecfdf5;color:var(--g2)}
.chip.red{background:#fef2f2;color:#dc2626}
.chip.amb{background:#fffbeb;color:#b45309}
.bar{height:10px;background:#eee;border-radius:9px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--g);border-radius:9px}
.btn{display:inline-block;background:var(--g);color:#fff;font-weight:700;font-size:15px;padding:10px 16px;border-radius:12px;margin-top:12px}
/* receipts (hook) */
.rcpt{position:absolute;width:300px;background:#fafaf7;color:#111;border-radius:6px 6px 0 0;padding:20px 22px 26px;font-family:'InterV',sans-serif;
  box-shadow:0 30px 70px rgba(0,0,0,.6);
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 10px) no-repeat,radial-gradient(circle at 8px 0,transparent 7px,#000 7.5px) bottom/16px 10px repeat-x;}
.rcpt small{display:block;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#888;font-weight:600}
.rcpt b{display:block;font-size:46px;letter-spacing:-.04em;color:var(--red);font-weight:750;margin-top:6px}
.rcpt span{font-size:16px;color:#444;font-weight:500}
/* network */
.node{position:absolute;display:flex;align-items:center;gap:14px;background:#fff;color:var(--ink);border-radius:20px;padding:14px 24px 14px 14px;
  font-family:'InterV',sans-serif;font-weight:650;font-size:30px;letter-spacing:-.02em;box-shadow:0 20px 60px rgba(0,0,0,.5);white-space:nowrap}
.node .ic{width:60px;height:60px;border-radius:14px;background:#f2f2f2;display:grid;place-items:center;overflow:hidden}
.node .ic img{width:100%;height:100%;object-fit:contain}
.node .ic svg{width:32px;height:32px}
/* phone */
.phone{position:absolute;width:460px;height:940px;border-radius:70px;background:#0b0b0b;padding:16px;box-shadow:0 60px 120px rgba(0,0,0,.45),inset 0 0 0 2px #333}
.phone:after{content:'';position:absolute;inset:16px;border-radius:56px;background:linear-gradient(115deg,rgba(255,255,255,.35),transparent 30%);pointer-events:none}
.screen{width:100%;height:100%;border-radius:56px;background:#f3f2ee;overflow:hidden;position:relative;font-family:'InterV',sans-serif}
.ph-head{height:150px;background:#fff;display:flex;align-items:flex-end;gap:14px;padding:0 24px 18px;border-bottom:1px solid #e7e7e7}
.ph-av{width:52px;height:52px;border-radius:50%;background:#0a0a0a;position:relative}
.ph-av:after{content:'';position:absolute;width:12px;height:12px;background:var(--g);right:12px;bottom:13px;border-radius:1px}
.ph-av:before{content:'f';position:absolute;left:15px;top:4px;color:#fff;font-weight:800;font-size:34px;font-family:'Inter Display','InterV'}
.ph-name{font-weight:700;font-size:21px;color:#111}
.ph-st{font-size:15px;color:var(--g2);font-weight:600}
.msgs{position:absolute;left:0;right:0;top:160px;bottom:0;padding:14px 18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:86%;background:#fff;color:#111;border-radius:22px 22px 22px 6px;padding:14px 18px;font-size:19px;line-height:1.38;box-shadow:0 2px 6px rgba(0,0,0,.06);transform-origin:0 100%}
.msg.me{align-self:flex-end;background:#d1fae5;border-radius:22px 22px 6px 22px;transform-origin:100% 100%}
.msg .t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:5px;letter-spacing:.02em}
.msg .t i{width:10px;height:10px;border-radius:50%;background:var(--red);display:inline-block}
.msg .t i.g{background:var(--g)}
.msg .act{display:flex;gap:8px;margin-top:10px}
.msg .act span{font-size:15px;font-weight:700;color:var(--g2);background:#ecfdf5;border-radius:10px;padding:6px 12px}
.typing{display:flex;gap:6px;padding:18px 20px}
.typing i{width:10px;height:10px;border-radius:50%;background:#aaa;display:block}
/* HUD */
#hud{position:absolute;inset:0;z-index:40;pointer-events:none;font-family:'InterV',sans-serif;font-size:15px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;--c:255,255,255}
#hud .c{position:absolute;color:rgba(var(--c),.6);display:flex;align-items:center;gap:12px;white-space:nowrap}
#hud .tl{left:56px;top:46px}#hud .tr{right:56px;top:46px}#hud .bl{left:56px;bottom:44px}#hud .br{right:56px;bottom:44px}
#hud .fm{width:22px;height:30px;position:relative}
#hud .fm .wm{inset:0;background:rgb(var(--c))}
#hud .fm .sq{left:67.9%;top:76.7%;width:32.1%;height:23.3%}
#hud .prog{position:absolute;left:56px;right:56px;bottom:28px;height:2px;background:rgba(var(--c),.14)}
#hud .prog i{display:block;height:100%;background:var(--g);width:0}
#hud .chap{display:inline-block;overflow:hidden;height:1.3em;vertical-align:top}
#hud .chap span{display:block}
/* fx */
#grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.11;z-index:50;background-size:480px 270px;image-rendering:pixelated}
#vig{position:absolute;inset:0;pointer-events:none;z-index:49;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.22) 100%)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:48;pointer-events:none}
/* preview UI */
#ui{position:fixed;left:0;right:0;bottom:0;padding:14px 20px;display:flex;gap:14px;align-items:center;background:linear-gradient(transparent,rgba(0,0,0,.8));font:600 13px system-ui;color:#fff;z-index:99;opacity:0;transition:opacity .3s}
body:hover #ui{opacity:1}
#ui button,#ui a{background:#10b981;border:0;color:#fff;font:700 13px system-ui;padding:8px 16px;border-radius:8px;cursor:pointer;text-decoration:none}
#ui input{flex:1;accent-color:#10b981}
#start{position:fixed;inset:0;display:grid;place-items:center;z-index:100;background:rgba(0,0,0,.55);cursor:pointer;color:#fff;font:700 18px system-ui;letter-spacing:.1em}
#start span{border:1.5px solid rgba(255,255,255,.5);padding:18px 34px;border-radius:99px}
body.render #ui,body.render #start{display:none}
</style>
<link rel="stylesheet" href="assets/masks.css">
</head>

// HUD: chapter labels + theme per time
const CHAPS = [[0, 0], [7, 1], [11, 2], [24.3, 3], [39, 4]];
const LIGHT = [[5.0, 7.55], [17.25, 22.0], [22.0, 24.3], [34.2, 36.4]];
const HUD_OFF = [[7.0, 8.9], [45.2, 99]];
function hud(t) {
  const h = $('hud');
  let o = t < .5 ? P(t, .2, .5) : 1;
  for (const [a, b] of HUD_OFF) {
    if (t >= a && t < b) o = 0;
    else if (t >= a - .2 && t < a) o = Math.min(o, 1 - P(t, a - .2, a));
    else if (t >= b && t < b + .4) o = Math.min(o, P(t, b, b + .4));
  }
  h.style.opacity = o;
  const light = LIGHT.some(([a, b]) => t >= a && t < b);
  h.style.setProperty('--c', light ? '10,10,10' : '255,255,255');
  let ci = 0, ca = 0; CHAPS.forEach(([a, idx]) => { if (t >= a) { ci = idx; ca = a; } });
  const ch = $('chap'); ch.textContent = T.chap[ci];
  const k = E.oX(P(t, ca + (ci === 1 ? 1.9 : 0), ca + (ci === 1 ? 1.9 : 0) + .5));
  ch.style.transform = `translateY(${(1 - k) * 110}%)`;
  $('progbar').style.width = (t / DUR * 100) + '%';
}

const FLASH = [[34.2, .35], [45.2, .25]];
function render(t) {
  for (const s of scenes) {
    const on = t >= s.a && t < s.b;
    if (on) { s.el.style.display = 'block'; s.fn(t); } else s.el.style.display = 'none';
  }
  let f = 0; for (const [a, v] of FLASH) f = Math.max(f, v * (1 - P(t, a, a + .25)) * (t >= a ? 1 : 0));
  $('flash').style.opacity = f;
  hud(t);
  $('grain').style.backgroundImage = grains[Math.floor(t * 24) % grains.length];
}
window.seek = t => { render(t); return true; };

const isRender = params.has('render');
if (isRender) document.body.classList.add('render');
function fit() { if (isRender) return; const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `scale(${s})`; }
addEventListener('resize', fit); fit();
$('langbtn').textContent = LANG === 'en' ? 'ES' : 'EN';
$('langbtn').href = '?lang=' + (LANG === 'en' ? 'es' : 'en');

window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })));
  measure();
  render(params.has('t') ? +params.get('t') : 0);
  return true;
})();

if (!isRender) {
  const aud = $('aud'), sc = $('scrub'), tc = $('tc'), btn = $('play');
  let playing = false, t0 = 0, base = 0;
  const now = () => playing ? (aud.readyState > 2 && !aud.paused ? aud.currentTime : base + (performance.now() - t0) / 1000) : base;
  function loop() {
    let t = now(); if (t >= DUR) { t = DUR - .001; pause(); }
    render(t); sc.value = t; tc.textContent = t.toFixed(2);
    requestAnimationFrame(loop);
  }
  function play() { if (base >= DUR - .05) base = 0; aud.currentTime = base; aud.play().catch(() => { }); t0 = performance.now(); playing = true; btn.textContent = 'Pausa'; }
  function pause() { base = now(); playing = false; aud.pause(); btn.textContent = 'Play'; }
  btn.onclick = () => playing ? pause() : play();
  sc.oninput = () => { base = +sc.value; if (playing) { aud.currentTime = base; t0 = performance.now(); } };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); } });
  $('start').onclick = () => { $('start').remove(); play(); };
  window.ready.then(() => requestAnimationFrame(loop));
}
</script>
</body>
</html>
